[package]
name = "edgecube-tools"
version = "1.0.6"
edition = { workspace = true }
description = "EdgeCube tools (archive/ftp/ssh) Android JNI"
license = { workspace = true }
publish = { workspace = true }

[lib]
name = "edgecube_tools"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["archive", "ftp", "ssh"]
archive = [
    "dep:unrar",
    "dep:zip",
    "dep:tar",
    "dep:flate2",
    "dep:bzip2",
    "dep:xz2",
    "dep:ruzstd",
    "dep:lz4_flex",
    "dep:sevenz-rust2",
]
ftp = [
    "dep:libunftp",
    "dep:unftp-core",
    "dep:unftp-sbe-fs",
    "dep:unftp-sbe-restrict",
    "dep:async-trait",
    "dep:tokio",
]
ssh = [
    "dep:russh",
    "dep:russh-sftp",
    "dep:tokio"
]

[dependencies]
anyhow = { workspace = true }
jni = { workspace = true }
serde_json = { workspace = true }
edgecube-pty = { path = "../edgecube-pty" }
unrar = { version = "0.5.8", optional = true }
zip = { version = "8.6.0", optional = true, default-features = false, features = [
    "deflate-flate2",
    "deflate64",
    "bzip2",
    "zstd",
    "lzma",
    "xz",
    "ppmd",
] }
tar = { version = "0.4.46", optional = true }
flate2 = { version = "1.1.10", optional = true }
bzip2 = { version = "0.6.1", optional = true }
xz2 = { version = "0.1.7", optional = true }
ruzstd = { version = "0.9.0", optional = true }
lz4_flex = { version = "0.14.0", optional = true }
sevenz-rust2 = { version = "0.23.0", optional = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"], optional = true }
russh = { version = "0.63.3", default-features = false, features = ["flate2", "ring"], optional = true }
russh-sftp = { version = "3.0.0", optional = true }
libunftp = { version = "0.23.1", default-features = false, features = ["ring"], optional = true }
unftp-core = { version = "0.1.0", optional = true }
unftp-sbe-fs = { version = "0.4.0", optional = true }
unftp-sbe-restrict = { version = "0.1.5", optional = true }
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
zstd = "0.13"

[build-dependencies]
cc = "1"
