[package]
name = "edgecube-pty"
version = "1.0.6"
edition = { workspace = true }
description = "EdgeCube PTY bridge (Android JNI) + PTY spawn primitives"
license = { workspace = true }
publish = { workspace = true }

[lib]
name = "edgecube_pty"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { workspace = true }
jni = { workspace = true }
portable-pty = "0.9"
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
