[package]
name = "edgecube-pty"
version = "0.1.0"
edition = "2024"
description = "EdgeCube PTY bridge (Android JNI) + PTY spawn primitives"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "edgecube_pty"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
jni = "0.21"
portable-pty = "0.9"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = true
overflow-checks = false
debug-assertions = false
